<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X Ads SVG — motion playground</title>
  <style>
    /* Token sheet (subset) — full map in references/tokens.md */
    :root, :host {
      --color-black: #000;
      --color-white: #fff;
      --color-neutral-0: #f2f2f2;
      --color-neutral-1100: #0d0d0d;
      --color-black-a10: #0000001a;
      --color-white-a10: #ffffff1a;
      --x-bg-primary: var(--color-white);
      --x-fg-primary: var(--color-black);
      --x-fg-secondary: #0009;
      --x-border-normal: var(--color-black-a10);
      --x-canvas: var(--color-neutral-0);
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    [data-theme="dark"], .dark {
      --x-bg-primary: var(--color-black);
      --x-fg-primary: var(--color-white);
      --x-fg-secondary: #fff9;
      --x-border-normal: var(--color-white-a10);
      --x-canvas: var(--color-neutral-1100);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--x-canvas);
      color: var(--x-fg-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1.25rem 3rem;
      transition: background 0.35s ease, color 0.35s ease;
    }

    header { text-align: center; max-width: 36rem; }
    header p.kicker {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--x-fg-secondary);
      margin-bottom: 0.65rem;
    }
    header h1 {
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    header p.sub {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--x-fg-secondary);
      line-height: 1.5;
    }
    header p.disclaimer {
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      color: var(--x-fg-secondary);
    }

    .stage {
      width: min(100%, 420px);
      aspect-ratio: 1;
      background: var(--x-bg-primary);
      border: 1px solid var(--x-border-normal);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .stage svg {
      width: 100%;
      height: 100%;
      color: var(--x-fg-primary);
      overflow: visible;
    }

    /* Ambient CSS — canonical copy in references/svg/animation.md */
    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes dash-flow { to { stroke-dashoffset: -6.4; } }
    @keyframes on-off {
      0%, 46% { opacity: 1; }
      54%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes core-blink {
      0%, 49% { fill: var(--x-fg-primary); }
      51%, 100% { fill: var(--x-bg-primary); }
    }
    @keyframes pop-in {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes draw-ring {
      from { stroke-dashoffset: 1; opacity: 0; transform: rotate(180deg); }
      to   { stroke-dashoffset: 0; opacity: 1; transform: rotate(35deg); }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .ring-outer  { transform-box: fill-box; transform-origin: center; animation: spin-cw 169s linear infinite; }
    .ring-inner  { transform-box: fill-box; transform-origin: center; animation: spin-ccw 169s linear infinite; }
    .mechanism   { transform-box: fill-box; transform-origin: center; animation: spin-cw 60s linear infinite; }
    .arm-tip     { transform-box: fill-box; transform-origin: center; animation: spin-ccw 60s linear infinite; }
    .flow        { stroke-dasharray: 3.2 3.2; animation: dash-flow 4.919s linear infinite; }
    .marker-lit  { animation: on-off 6s ease-in-out infinite; }
    .marker-lit--2 { animation-delay: 2s; }
    .marker-lit--3 { animation-delay: 4s; }
    .core        { animation: core-blink 1.2s linear infinite alternate; }

    .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0; }
    .stage.revealed .draw {
      stroke-dashoffset: 0; opacity: 1;
      transition: stroke-dashoffset 1.05s cubic-bezier(.32,.72,0,1), opacity 0.4s linear;
      transition-delay: 0.15s;
    }
    .enter-ring {
      stroke-dasharray: 1 1; stroke-dashoffset: 1; opacity: 0;
      transform-box: fill-box; transform-origin: center; transform: rotate(180deg);
    }
    .stage.revealed .enter-ring { animation: draw-ring 0.9s cubic-bezier(.32,.72,0,1) forwards; }
    .stage.revealed .enter-ring:nth-of-type(1) { animation-delay: 0.35s; animation-duration: 0.65s; }
    .stage.revealed .enter-ring:nth-of-type(2) { animation-delay: 0.55s; animation-duration: 0.85s; }
    .pop { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; }
    .stage.revealed .pop { animation: pop-in 0.4s cubic-bezier(.32,.72,0,1) 0.5s forwards; }
    .enter-fade { opacity: 0; }
    .stage.revealed .enter-fade { animation: fade-in 0.45s ease 1.1s forwards; }

    .caption {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      width: min(100%, 420px);
    }
    .caption figure {
      border: 1px solid var(--x-border-normal);
      padding: 0.85rem 0.75rem;
      background: var(--x-bg-primary);
    }
    .caption figcaption {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--x-fg-secondary);
      margin-bottom: 0.55rem;
    }
    .caption svg { width: 100%; height: auto; display: block; color: var(--x-fg-primary); }

    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: transparent;
      color: var(--x-fg-primary);
      border: 1px solid var(--x-border-normal);
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    button:hover { background: var(--x-fg-primary); color: var(--x-bg-primary); }

    @media (prefers-reduced-motion: reduce) {
      .ring-outer, .ring-inner, .mechanism, .arm-tip, .flow,
      .marker-lit, .core, .enter-ring, .pop { animation: none !important; }
      .draw, .enter-ring, .pop, .enter-fade {
        opacity: 1 !important; stroke-dashoffset: 0 !important; transform: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">xads-design · svg motion playground</p>
    <h1>Hairline schematic in motion</h1>
    <p class="sub">Targeting diagram with dashed rings, 60s mechanism, dash-flow connectors, and twin-state nodes.</p>
    <p class="disclaimer">Motion playground — NOT a fidelity proof. Compare geometry to fixtures/golden/*.svg.</p>
  </header>

  <div class="stage" id="stage">
    <!-- Canonical mini viewBox: -6 -6 84 84 -->
    <svg viewBox="-6 -6 84 84" fill="none" xmlns="http://www.w3.org/2000/svg"
         shape-rendering="geometricPrecision" stroke-width="0.2" aria-hidden="true">

      <g class="ring-outer enter-fade" data-part="orbit-outer">
        <circle cx="36" cy="36" r="35" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3.2 3.2"/>
      </g>

      <circle class="enter-ring" data-part="structure" cx="36" cy="36" r="23"
              stroke="currentColor" stroke-width="0.5" pathLength="1"
              fill="var(--x-bg-primary)"/>

      <g class="ring-inner enter-fade" data-part="orbit-inner">
        <circle cx="36" cy="36" r="18" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3 3"/>
      </g>

      <g data-part="axis">
        <line class="draw" x1="36" y1="2" x2="36" y2="70"
              stroke="currentColor" stroke-width="0.5" pathLength="1"/>
        <line class="draw" x1="2" y1="36" x2="70" y2="36"
              stroke="currentColor" stroke-width="0.5" pathLength="1"/>
      </g>

      <g data-group="connectors" class="enter-fade">
        <line class="flow" x1="4" y1="4" x2="28" y2="28" stroke="currentColor" stroke-width="0.5"/>
        <line class="flow" x1="68" y1="4" x2="44" y2="28" stroke="currentColor" stroke-width="0.5"
              style="animation-direction: reverse"/>
        <line class="flow" x1="4" y1="68" x2="28" y2="44" stroke="currentColor" stroke-width="0.5"
              style="animation-direction: reverse"/>
        <line class="flow" x1="68" y1="68" x2="44" y2="44" stroke="currentColor" stroke-width="0.5"/>
      </g>

      <g data-group="node" data-pos="tl" class="pop">
        <rect data-state="hollow" x="2" y="2" width="4" height="4"
              fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect data-state="filled" class="marker-lit" x="2" y="2" width="4" height="4"
              fill="currentColor"/>
      </g>
      <g data-group="node" data-pos="tr" class="pop">
        <circle data-state="hollow" cx="70" cy="4" r="2"
                fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <circle data-state="filled" class="marker-lit marker-lit--2" cx="70" cy="4" r="2"
                fill="currentColor"/>
      </g>
      <g data-group="node" data-pos="bl" class="pop">
        <circle data-state="hollow" cx="4" cy="70" r="2"
                fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <circle data-state="filled" class="marker-lit marker-lit--3" cx="4" cy="70" r="2"
                fill="currentColor"/>
      </g>
      <g data-group="node" data-pos="br" class="pop">
        <rect data-state="hollow" x="68" y="68" width="4" height="4"
              fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect data-state="filled" class="marker-lit" x="68" y="68" width="4" height="4"
              fill="currentColor" style="animation-delay: 1s"/>
      </g>

      <g class="mechanism enter-fade" data-group="mechanism">
        <g>
          <line x1="36" y1="36" x2="36" y2="13" stroke="currentColor" stroke-width="0.5"/>
          <g class="arm-tip" transform="translate(36 13)">
            <rect x="-2" y="-2" width="4" height="4"
                  fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          </g>
        </g>
        <g transform="rotate(120 36 36)">
          <line x1="36" y1="36" x2="36" y2="13" stroke="currentColor" stroke-width="0.5"/>
          <g class="arm-tip" transform="translate(36 13)">
            <rect x="-2" y="-2" width="4" height="4"
                  fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          </g>
        </g>
        <g transform="rotate(240 36 36)">
          <line x1="36" y1="36" x2="36" y2="13" stroke="currentColor" stroke-width="0.5"/>
          <g class="arm-tip" transform="translate(36 13)">
            <rect x="-2" y="-2" width="4" height="4"
                  fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          </g>
        </g>
      </g>

      <!-- Hub: r=9 knockout + r=2 core (NOT r=5 carriage as hub) -->
      <g data-group="hub" class="pop">
        <circle data-part="ring" cx="36" cy="36" r="9"
                fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <circle data-part="center-dot" class="core" cx="36" cy="36" r="2"
                fill="currentColor"/>
      </g>
    </svg>
  </div>

  <div class="caption">
    <figure>
      <figcaption>Relay · dash flow</figcaption>
      <svg width="84" height="84" viewBox="-6 -6 84 84" fill="none"
           shape-rendering="geometricPrecision" stroke-width="0.2" aria-hidden="true">
        <g data-group="connectors">
          <line class="flow" x1="2" y1="36" x2="36" y2="36" stroke="currentColor" stroke-width="0.5"/>
          <line class="flow" x1="36" y1="36" x2="70" y2="2" stroke="currentColor" stroke-width="0.5"/>
          <line class="flow" x1="36" y1="36" x2="70" y2="70" stroke="currentColor" stroke-width="0.5"/>
        </g>
        <g data-group="node" data-pos="left">
          <rect data-state="hollow" x="0" y="34" width="4" height="4"
                fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <rect data-state="filled" class="marker-lit" x="0" y="34" width="4" height="4"
                fill="currentColor"/>
        </g>
        <circle cx="70" cy="2" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <circle cx="70" cy="70" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <g data-group="hub">
          <circle cx="36" cy="36" r="9" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle class="core" cx="36" cy="36" r="2" fill="currentColor"/>
        </g>
      </svg>
    </figure>

    <figure>
      <figcaption>Rails · r=9 carriage</figcaption>
      <svg width="84" height="84" viewBox="-6 -6 84 84" fill="none"
           shape-rendering="geometricPrecision" stroke-width="0.2" aria-hidden="true">
        <line class="flow" x1="4" y1="18" x2="68" y2="18" stroke="currentColor" stroke-width="0.5"/>
        <line class="flow" x1="4" y1="36" x2="68" y2="36" stroke="currentColor" stroke-width="0.5"
              style="animation-direction: reverse"/>
        <line class="flow" x1="4" y1="54" x2="68" y2="54" stroke="currentColor" stroke-width="0.5"/>
        <rect x="0" y="16" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect x="68" y="16" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect x="0" y="34" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect x="68" y="34" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect x="0" y="52" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <rect x="68" y="52" width="4" height="4" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
        <g data-part="carriage" transform="translate(28 18)">
          <circle r="9" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle r="2" class="core" fill="currentColor"/>
        </g>
        <g data-part="carriage" transform="translate(48 36)">
          <circle r="9" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle r="2" class="core" fill="currentColor" style="animation-delay: 0.4s"/>
        </g>
        <g data-part="carriage" transform="translate(22 54)">
          <circle r="9" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle r="2" class="core" fill="currentColor" style="animation-delay: 0.8s"/>
        </g>
      </svg>
    </figure>

    <figure>
      <figcaption>Petals · diamond</figcaption>
      <svg width="84" height="84" viewBox="-6 -6 84 84" fill="none"
           shape-rendering="geometricPrecision" stroke-width="0.2" aria-hidden="true">
        <circle class="flow" cx="36" cy="19" r="14" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3.2 3.2"/>
        <circle class="flow" cx="53" cy="36" r="14" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3 3" style="animation-direction: reverse"/>
        <circle class="flow" cx="36" cy="53" r="14" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3.2 3.2"/>
        <circle class="flow" cx="19" cy="36" r="14" stroke="currentColor" stroke-width="0.5"
                stroke-dasharray="3 3" style="animation-direction: reverse"/>
        <rect x="34" y="34" width="4" height="4"
              fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"
              style="transform-box: fill-box; transform-origin: center; transform: rotate(45deg)"/>
        <g>
          <circle cx="36" cy="5" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle class="marker-lit" cx="36" cy="5" r="2" fill="currentColor"/>
        </g>
        <g>
          <circle cx="67" cy="36" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle class="marker-lit marker-lit--2" cx="67" cy="36" r="2" fill="currentColor"/>
        </g>
        <g>
          <circle cx="36" cy="67" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle class="marker-lit marker-lit--3" cx="36" cy="67" r="2" fill="currentColor"/>
        </g>
        <g>
          <circle cx="5" cy="36" r="2" fill="var(--x-bg-primary)" stroke="currentColor" stroke-width="0.5"/>
          <circle class="marker-lit" cx="5" cy="36" r="2" fill="currentColor" style="animation-delay: 3s"/>
        </g>
      </svg>
    </figure>
  </div>

  <div class="controls">
    <button type="button" id="theme-btn" aria-pressed="false">Toggle theme</button>
    <button type="button" id="replay-btn">Replay entrance</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const themeBtn = document.getElementById('theme-btn');
    const replayBtn = document.getElementById('replay-btn');

    requestAnimationFrame(() => stage.classList.add('revealed'));

    themeBtn.addEventListener('click', () => {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      themeBtn.setAttribute('aria-pressed', String(!dark));
    });

    replayBtn.addEventListener('click', () => {
      stage.classList.remove('revealed');
      void stage.offsetWidth;
      requestAnimationFrame(() => stage.classList.add('revealed'));
    });
  </script>
</body>
</html>
